name: tagpr

on:
  push:
    branches:
      - main
  # Toggling tagpr:minor / tagpr:major labels on the release PR should update
  # its proposed version right away, instead of waiting for the next push to
  # main to make tagpr recompute it.
  pull_request:
    types:
      - labeled
      - unlabeled
  workflow_dispatch:

concurrency: tagpr

jobs:
  tagpr:
    # Label events only matter on tagpr's own release PR; skip the rest so
    # ordinary PR labeling doesn't spend runner time.
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'tagpr-from-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: read
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
      pull_request: ${{ steps.tagpr.outputs.pull_request }}
    steps:
      # persist-credentials stays on (default) so tagpr can push the release PR and tag
      # ref: main because on pull_request events the default checkout is the
      # PR merge ref, while tagpr always operates on the release branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - id: tagpr
        uses: Songmu/tagpr@e1250d6c84e4425db82b5e90549d62dfe23e9ebe # v1.21.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # pull_request runs on the release PR need approval because
  # github-actions[bot] counts as an external contributor; workflow_dispatch
  # does not.
  ci:
    needs: tagpr
    if: needs.tagpr.outputs.tag == '' && needs.tagpr.outputs.pull_request != ''
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch CI on the release branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ fromJSON(needs.tagpr.outputs.pull_request).head.ref }}
        run: gh workflow run ci.yaml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF"

  # The release jobs below run in this workflow instead of a tag-triggered one
  # because tags pushed with GITHUB_TOKEN do not trigger `on: push: tags`
  # workflows. They run only when tagpr just tagged a release-PR merge, and
  # check out that tag explicitly. To retry a failed release, re-run only the
  # failed jobs: a full re-run finds no new tag and skips everything.

  # The six-RID engine and server matrix plus the bundle (spec §9.1), built
  # from the tag; uploads `ccusage-release-assets`.
  build-artifacts:
    needs: tagpr
    if: needs.tagpr.outputs.tag != ''
    permissions:
      contents: read
    uses: ./.github/workflows/build-artifacts.yaml
    with:
      ref: ${{ needs.tagpr.outputs.tag }}

  # Publishes ccusage.mcpb, the six ccusage-mcp-<rid> archives and SHA256SUMS
  # (spec §9.3). --verify-tag refuses to create a tag, so the release attaches
  # to the one tagpr pushed. The `if:` already implies success(); the explicit
  # result check states that a release needs a fully successful build.
  release:
    needs:
      - tagpr
      - build-artifacts
    if: needs.tagpr.outputs.tag != '' && needs.build-artifacts.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # gh resolves the repository from the checkout's origin remote.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tagpr.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ccusage-release-assets
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tagpr.outputs.tag }}
        run: gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag
