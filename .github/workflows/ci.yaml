name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Dispatched by release.yaml for tagpr's release PR, and by hand for the
  # sync/upstream PR, whose GITHUB_TOKEN-opened PR triggers no CI (spec §9.4).
  workflow_dispatch:

permissions: read-all

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-slim
    outputs:
      code-changed: ${{ steps.detect.outputs.code-changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        uses: ./.github/actions/detect-code-changes

  # Security gate: scan the repository with tirith (https://tirith.sh/docs/ci/)
  # before any of the real CI work runs. This is wired on `pull_request` (not
  # `pull_request_target`), so fork PRs only ever get a read-only token and
  # cannot leak secrets while we scan their code. The downstream jobs `needs`
  # this job, so they are skipped unless tirith passes. tirith is installed from
  # the flake's pinned package so CI matches the dev shell.
  tirith-scan:
    name: tirith security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Read-only: this job executes PR-controlled code (the local action, the PR
    # flake, the installed tirith), so it must hold no write scopes. The SARIF
    # is published from the separate `tirith-sarif-upload` job, which never runs
    # PR code, keeping the elevated `security-events: write` away from the scan.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-nix-cache
      - name: Install tirith
        run: nix profile install .#tirith
      # One pass produces the SARIF report and sets the gate exit code. tirith's
      # `--ci` exit code is: 0 = no findings, 1 = findings at/above --fail-on,
      # 2 = findings present but all below it. We capture it (rather than letting
      # it abort the step) so the SARIF still uploads before the gate decides.
      #
      # `*.snap` are excluded: they are terminal snapshot test fixtures that
      # intentionally contain ANSI escape sequences, so the `ansi_escapes` rule
      # (High) fires on them as a false positive. The rule stays active for real
      # source files; we only skip the test data.
      - name: Scan repository with tirith
        id: scan
        run: |
          set +e
          tirith scan --ci --fail-on high --exclude '*.snap' --format sarif ./ > results.sarif
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "tirith exited ${code}"
      - name: Summarize findings
        if: always()
        run: |
          count="$(jq '[.runs[].results[]?] | length' results.sarif 2>/dev/null || echo 0)"
          echo "tirith reported ${count} finding(s)" | tee -a "$GITHUB_STEP_SUMMARY"
          jq -r '.runs[].results[]? | "- [\(.level // "warning")] \(.ruleId): \(.locations[0].physicalLocation.artifactLocation.uri)"' \
            results.sarif 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
      # Hand the SARIF to the privileged upload job as an artifact. Uploaded
      # before the gate step so findings reach the Security tab even when the
      # gate then blocks the PR.
      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tirith-sarif
          path: results.sarif
          if-no-files-found: error
      - name: Gate CI on tirith findings
        if: always()
        env:
          SCAN_EXIT: ${{ steps.scan.outputs.exit_code }}
        run: |
          case "$SCAN_EXIT" in
            0 | 2)
              echo "tirith gate passed (exit ${SCAN_EXIT}: no findings, or all below 'high')"
              ;;
            1)
              echo "::error::tirith found findings at or above the 'high' threshold; blocking downstream CI"
              exit 1
              ;;
            *)
              echo "::error::tirith scan errored (exit ${SCAN_EXIT}); blocking downstream CI"
              exit 1
              ;;
          esac

  # Publish the tirith SARIF to the Security tab. Split from the scan so the
  # `security-events: write` scope lives in a job that never executes
  # PR-controlled code: it only downloads the artifact and runs trusted, pinned
  # actions. `always()` so findings are published even when the gate blocked the
  # PR; skipped for fork PRs, whose token is read-only and cannot upload.
  tirith-sarif-upload:
    name: tirith SARIF upload
    needs: tirith-scan
    if: ${{ always() && !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      # Checkout only places files for path mapping; no PR code is executed in
      # this privileged job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tirith-sarif
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
          category: tirith

  # Fast, unconditional fail-fast gate for the cheap-but-high-signal checks:
  # secret detection (gitleaks) and workflow/format lint (the treefmt check,
  # which runs actionlint + zizmor with the repo's exact ignore config). Runs in
  # parallel with tirith-scan and is NOT gated on `changes`, so secrets and
  # workflow regressions are caught even on docs-only PRs and on fork PRs (where
  # local git hooks never run). Both are existing flake checks, so this reuses
  # their exact behavior instead of re-specifying flags here. The heavy test job
  # re-runs them inside `nix flake check`; that is intentional duplication so the
  # gate can still fail the run early. Build and test jobs start alongside it
  # instead of waiting on it: it takes ~45s and sat on the critical path ahead
  # of the slowest build, and `ci-gate` still requires it to pass.
  preflight:
    name: security & lint preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-nix-cache
      - name: Secret scan and workflow lint
        run: nix build --print-build-logs .#checks.x86_64-linux.gitleaks .#checks.x86_64-linux.treefmt

  test:
    needs: [changes, tirith-scan]
    if: needs.changes.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-nix-cache
      - parallel:
          - name: Run nix flake check
            run: nix flake check --print-build-logs
          - name: Run Rust tests
            run: nix build .#ccusage-tests --print-build-logs

  # Unit, runner, drift and schema-snapshot tests of the C# server (spec §9.2).
  # The e2e tests report inconclusive here; the `e2e` job runs them against the
  # built artifacts. The suite is platform-independent; its macOS leg runs in
  # the non-blocking `dotnet-test-macos-arm64` job below.
  dotnet-test:
    name: dotnet test (${{ matrix.os }})
    needs: [changes, tirith-scan]
    if: needs.changes.outputs.code-changed == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    # dotnet/global.json selects the SDK and the Microsoft.Testing.Platform
    # runner; the SDK only finds it when run from dotnet/.
    defaults: &dotnet-test-defaults
      run:
        shell: bash
        working-directory: dotnet
    steps: &dotnet-test-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: dotnet/global.json
      - name: Build
        run: dotnet build Ccusage.Mcp.slnx -c Release
      - name: Test
        run: dotnet test --project Ccusage.Mcp.slnx -c Release --no-build

  # The jobs named "(non-blocking)" run the gating jobs' steps (YAML aliases,
  # so they cannot drift) on Apple-silicon macos-latest runners and stay out
  # of `ci-gate`'s needs: those runners are often unavailable for hours, and a
  # job that never gets one ends abandoned, which continue-on-error does not
  # cover (spec §9.1, §16 item 8). A failure here is still an osx-arm64
  # regression to fix; the gate relies on the Mach-O check in
  # build-artifacts.yaml instead.
  dotnet-test-macos-arm64:
    name: dotnet test (${{ matrix.os }}, non-blocking)
    needs: [changes, tirith-scan]
    if: needs.changes.outputs.code-changed == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      matrix:
        os: [macos-latest]
    defaults: *dotnet-test-defaults
    steps: *dotnet-test-steps

  # The six-RID engine and server matrix plus the bundle (spec §9.1).
  build-artifacts:
    needs: [changes, tirith-scan]
    if: needs.changes.outputs.code-changed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/build-artifacts.yaml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}

  # The published server and the real engine against the fixtures through the
  # MCP client (spec §10.3). osx-arm64 runs in the non-blocking
  # `e2e-osx-arm64` job below.
  e2e:
    name: e2e (${{ matrix.rid }})
    needs: build-artifacts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            exe: ''
          - os: windows-latest
            rid: win-x64
            exe: .exe
    steps: &e2e-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: dotnet/global.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ccusage-mcp-${{ matrix.rid }}
          path: ${{ runner.temp }}/bin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ccusage-${{ matrix.rid }}
          path: ${{ runner.temp }}/bin
      # upload-artifact drops the unix exec bits.
      - name: Make binaries executable
        shell: bash
        run: chmod +x "$RUNNER_TEMP"/bin/* || true
      # Both variables are set, so the e2e tests run instead of reporting
      # inconclusive; a wrong path fails them.
      - name: Test
        shell: bash
        working-directory: dotnet
        env:
          CCUSAGE_MCP_E2E_SERVER: ${{ runner.temp }}/bin/ccusage-mcp${{ matrix.exe }}
          CCUSAGE_ENGINE: ${{ runner.temp }}/bin/ccusage${{ matrix.exe }}
        run: dotnet test --project Ccusage.Mcp.slnx -c Release

  # Runs the cross-built osx-arm64 server and engine on arm64 (with
  # `bundle-smoke-macos-arm64`); see `dotnet-test-macos-arm64` for why it is
  # non-blocking.
  e2e-osx-arm64:
    name: e2e (${{ matrix.rid }}, non-blocking)
    needs: build-artifacts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: macos-latest
            rid: osx-arm64
            exe: ''
    steps: *e2e-steps

  # Extracts ccusage.mcpb, starts it through the manifest command for this OS
  # and calls initialize, tools/list, list-sources and daily. The Linux and
  # macOS legs assert the exec bits after extraction (spec §15 Q4; the gating
  # macOS leg is macos-15-intel); the windows-11-arm leg asserts the win-x64
  # server selects the arm64 engine (spec §15 Q5). macos-latest runs in the
  # non-blocking `bundle-smoke-macos-arm64` job below.
  bundle-smoke:
    name: bundle smoke (${{ matrix.os }})
    needs: build-artifacts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            expect: linux/x64/ccusage
          - os: ubuntu-24.04-arm
            expect: linux/arm64/ccusage
          - os: macos-15-intel
            expect: osx/x64/ccusage
          - os: windows-latest
            expect: 'win\x64\ccusage.exe'
          - os: windows-11-arm
            expect: 'win\arm64\ccusage.exe'
    steps: &bundle-smoke-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ccusage-release-assets
          path: ${{ runner.temp }}/assets
      - name: Smoke-test the bundle
        shell: pwsh
        env:
          EXPECT_ENGINE_PATH: ${{ matrix.expect }}
        run: ./dotnet/packaging/bundle-smoke.ps1 -Bundle "$env:RUNNER_TEMP/assets/ccusage.mcpb" -FixturesDir dotnet/tests/fixtures -ExpectEnginePath $env:EXPECT_ENGINE_PATH

  # See `dotnet-test-macos-arm64` for why it is non-blocking.
  bundle-smoke-macos-arm64:
    name: bundle smoke (${{ matrix.os }}, non-blocking)
    needs: build-artifacts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: macos-latest
            expect: osx/arm64/ccusage
    steps: *bundle-smoke-steps

  # Validates the plugin and the marketplace with Claude Code's own strict
  # validator, installed with its native installer at a pinned version.
  plugin-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CLAUDE_CODE_VERSION: 2.1.303
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_CODE_VERSION"
          installed="$("$HOME/.local/bin/claude" --version)"
          echo "$installed"
          case "$installed" in
            "$CLAUDE_CODE_VERSION"*) ;;
            *)
              echo "::error::expected Claude Code $CLAUDE_CODE_VERSION, got: $installed"
              exit 1
              ;;
          esac
      - name: Validate plugin
        run: |
          "$HOME/.local/bin/claude" plugin validate --strict plugin
      # The marketplace lives at .claude-plugin/marketplace.json; the bundle URL
      # is in plugin.json, the only placement Claude Code loads (spec §7.1).
      - name: Validate marketplace
        run: |
          "$HOME/.local/bin/claude" plugin validate --strict .

  # Every place that carries the release version must agree (spec §8).
  version-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Compare versions
        run: |
          v=$(jq -r .version package.json)
          d=$(jq -r .version docs/package.json)
          p=$(jq -r .version plugin/.claude-plugin/plugin.json)
          # An empty result (no download URL) fails the comparison below
          # instead of aborting the step through pipefail.
          u=$(jq -r '.mcpServers // ""' plugin/.claude-plugin/plugin.json | grep -o 'download/v[0-9][0-9.]*/ccusage.mcpb' | sed 's#download/v##; s#/ccusage.mcpb##' || true)
          b=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' dotnet/Directory.Build.props)
          if [ "$v" != "$d" ] || [ "$v" != "$p" ] || [ "$v" != "$u" ] || [ "$v" != "$b" ]; then
            echo "::error::version mismatch: package.json=$v docs=$d plugin=$p bundle-url=$u props=$b"
            exit 1
          fi
          echo "all versions are $v"

  # Builds the docs site on every change, docs-only ones included. The
  # development machine has no pnpm, so a stale pnpm-lock.yaml is regenerated
  # here, uploaded as the `pnpm-lock` artifact to commit, and fails the job.
  docs-build:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-nix-cache
      - name: Install pnpm, Node and just
        run: nix profile install --inputs-from . .#pnpm nixpkgs#nodejs nixpkgs#just
      - name: Regenerate the lockfile
        run: pnpm install --lockfile-only
      - name: Check the lockfile
        id: lockfile
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            echo changed=true >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.lockfile.outputs.changed == 'true'
        with:
          name: pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build docs
        run: just docs::build
      - name: Fail on a stale lockfile
        if: steps.lockfile.outputs.changed == 'true'
        run: |
          echo "::error::pnpm-lock.yaml is stale; download the pnpm-lock artifact and commit it"
          exit 1

  # Single check for main's branch ruleset to require. Most jobs above are gated
  # on `changes` and are skipped on docs-only pull requests, so requiring them
  # individually would leave those pull requests blocked on checks that never
  # report. Only `success` and `skipped` pass; every other result fails the
  # gate, including a job GitHub abandoned because no runner picked it up
  # (otherwise its skipped dependents would leave the gate green). The
  # "(non-blocking)" macos-latest jobs are deliberately not listed.
  ci-gate:
    name: ci gate
    needs:
      - changes
      - tirith-scan
      - tirith-sarif-upload
      - preflight
      - test
      - dotnet-test
      - build-artifacts
      - e2e
      - bundle-smoke
      - plugin-validate
      - version-consistency
      - docs-build
    if: ${{ always() }}
    runs-on: ubuntu-slim
    steps:
      # A missing result (null) also fails, so the check fails closed.
      - name: Fail unless every job succeeded or was skipped
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          bad="$(jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key) (\(.value.result))"] | join(", ")' <<< "$NEEDS")"
          if [ -n "$bad" ]; then
            echo "::error::not successful: $bad"
            exit 1
          fi

  # Dispatch runs aren't attached to the release PR; report via commit status.
  release-dispatch-status-pending:
    name: release dispatch status (pending)
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'tagpr-from-')
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Post pending commit status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f context='CI (release dispatch)' \
            -f description='CI is running' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  release-dispatch-status:
    name: release dispatch status
    needs:
      - release-dispatch-status-pending
      - ci-gate
    if: ${{ always() && github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'tagpr-from-') }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Post final commit status
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_RESULT: ${{ needs.ci-gate.result }}
        run: |
          if [ "$GATE_RESULT" = success ]; then
            state=success
            description='All CI jobs passed'
          else
            state=failure
            description="ci gate: $GATE_RESULT"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='CI (release dispatch)' \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
