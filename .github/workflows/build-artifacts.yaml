name: Build artifacts

# Reusable build matrix shared by ci.yaml and release.yaml (spec §9.1): each leg
# uploads the engine as `ccusage-<rid>` and, except win-arm64, the Native AOT
# server as `ccusage-mcp-<rid>`; `bundle` then assembles `ccusage.mcpb`, the
# per-platform archives and SHA256SUMS as `ccusage-release-assets`.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit, branch or tag to build
        type: string
        required: true

permissions: {}

jobs:
  build:
    name: build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        # `server` is set on every leg: GitHub's loose equality coerces both a
        # missing key (null) and false to 0, so `matrix.server != false` would
        # skip the server on every leg that omitted the key.
        include:
          - rid: linux-x64
            os: ubuntu-latest
            engine: nix-static
            arch: x64
            server: true
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            engine: nix-static
            arch: arm64
            server: true
          - rid: osx-arm64
            os: macos-latest
            engine: nix
            arch: arm64
            server: true
          - rid: osx-x64
            os: macos-15-intel
            engine: cargo-mac
            server: true
          - rid: win-x64
            os: windows-latest
            engine: cargo-win
            arch: x64
            server: true
          # The bundle ships only the win-x64 server, which runs emulated on
          # Windows ARM64 (spec §7.3), so this leg builds the engine alone.
          - rid: win-arm64
            os: windows-11-arm
            engine: cargo-win
            arch: arm64
            server: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/build-linux-native-package
        if: matrix.engine == 'nix-static'
        with:
          rid: ${{ matrix.rid }}
          binary: result/bin/ccusage
          cache-scope: ${{ matrix.rid }}
          nix-github-token: ${{ github.event_name != 'pull_request' }}

      - uses: ./.github/actions/build-macos-nix-native-package
        if: matrix.engine == 'nix'
        with:
          arch: arm64
          binary: result/bin/ccusage
          cache-scope: ${{ matrix.rid }}
          rid: ${{ matrix.rid }}

      # Only the arm64 leg saves its Cargo cache; see the action for the
      # additional main-only conditions.
      - uses: ./.github/actions/build-windows-native-package
        if: matrix.engine == 'cargo-win'
        with:
          binary: rust/target/release/ccusage.exe
          rid: ${{ matrix.rid }}
          save-cargo-cache: ${{ matrix.arch == 'arm64' }}

      # Intel macOS builds natively with cargo on its own runner. The minimal
      # profile of the pinned channel is enough for a release build;
      # RUSTUP_TOOLCHAIN takes precedence over rust-toolchain.toml, so cargo
      # does not install its extra components.
      - name: Install Rust toolchain
        id: toolchain
        if: matrix.engine == 'cargo-mac'
        shell: bash
        run: |
          channel="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          if [ -z "$channel" ]; then
            echo "::error file=rust-toolchain.toml::no channel found"
            exit 1
          fi
          rustup toolchain install "$channel" --profile minimal --no-self-update
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Build Cargo native binary
        if: matrix.engine == 'cargo-mac'
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.toolchain.outputs.channel }}
        run: cargo build --manifest-path rust/Cargo.toml --release --bin ccusage --features fetch-litellm-pricing

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.engine == 'cargo-mac'
        with:
          name: ccusage-osx-x64
          path: rust/target/release/ccusage
          if-no-files-found: error

      - uses: ./.github/actions/publish-mcp-server
        if: matrix.server != false
        with:
          rid: ${{ matrix.rid }}

  bundle:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # One directory per artifact (no merge-multiple): assemble-bundle.sh reads
      # <artifacts>/ccusage-<rid>/ccusage[.exe] and
      # <artifacts>/ccusage-mcp-<rid>/ccusage-mcp[.exe].
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ccusage-*
          path: ${{ runner.temp }}/artifacts

      - name: Assemble and verify bundle
        run: |
          version="$(jq -r .version package.json)"
          dotnet/packaging/assemble-bundle.sh --version "$version" --artifacts "$RUNNER_TEMP/artifacts" --out dist
          dotnet/packaging/verify-bundle.sh dist/ccusage.mcpb --version "$version"
          du -h dist/ccusage.mcpb | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ccusage-release-assets
          path: dist/*
          if-no-files-found: error
