name: Build Linux native package
description: Build and upload the Linux ccusage engine binary
inputs:
  arch:
    description: Native package architecture
    required: true
  rid:
    description: .NET runtime identifier naming the uploaded `ccusage-<rid>` artifact
    required: true
  binary:
    description: Path to the built ccusage binary
    required: true
  nix-github-token:
    description: Whether Nix builds may use the GitHub token from Nix config
    default: 'true'
  cache-scope:
    description: >
      Unique matrix-entry identifier (the matrix `name`) used to scope the Nix
      cache so the arm64 and x64 legs do not share one key.
    required: true
  save-nix-cache:
    description: Whether this job may persist the Nix store; forwarded to setup-nix-cache as `save`.
    default: 'true'
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-nix-cache
      with:
        cache-scope: ${{ inputs.cache-scope }}
        save: ${{ inputs.save-nix-cache }}
        gc-max-store-size-linux: 4G

    - name: Build Linux static binary
      shell: bash
      env:
        NIX_GITHUB_TOKEN: ${{ inputs.nix-github-token }}
      run: |
        if [ "$NIX_GITHUB_TOKEN" = "false" ]; then
          NIX_CONFIG="access-tokens =" nix build .#ccusage-static --print-build-logs
        else
          nix build .#ccusage-static --print-build-logs
        fi

    # The link lives inside the store's own gcroots, so it persists with the
    # cache-nix-action entry and protects these artifacts (and, through
    # keep-outputs, their toolchain) from the next garbage collection until a
    # later run replaces it.
    - name: Root current Crane artifacts for cache save
      if: inputs.save-nix-cache == 'true'
      shell: bash
      run: |
        system="$(nix eval --impure --raw --expr builtins.currentSystem)"
        mkdir -p /nix/var/nix/gcroots/ci
        nix build ".#packages.$system.ccusage-static.passthru.workspaceArtifacts.cacheRoot" \
          --out-link /nix/var/nix/gcroots/ci/ccusage-cargo-artifacts

    - name: Verify Linux binary is static
      shell: bash
      env:
        BINARY: ${{ inputs.binary }}
      run: |
        file "$BINARY"
        if ldd "$BINARY" > "$RUNNER_TEMP/ldd.txt" 2>&1; then
          cat "$RUNNER_TEMP/ldd.txt"
          grep -Eiq 'not a dynamic executable|statically linked' "$RUNNER_TEMP/ldd.txt"
        else
          cat "$RUNNER_TEMP/ldd.txt"
          grep -Eiq 'not a dynamic executable|statically linked' "$RUNNER_TEMP/ldd.txt"
        fi

    - name: Stage engine binary
      shell: bash
      env:
        BINARY: ${{ inputs.binary }}
      run: mkdir -p "$RUNNER_TEMP/engine" && cp "$BINARY" "$RUNNER_TEMP/engine/ccusage"

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ccusage-${{ inputs.rid }}
        path: ${{ runner.temp }}/engine/ccusage
        if-no-files-found: error
